<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>RIFTBURN</title>
    <meta name="description" content="A twin-stick arena roguelite. Seal the rift, burn everything that crawls out, and mutate your gun into something unreasonable." />
    <meta property="og:title" content="RIFTBURN" />
    <meta property="og:description" content="A twin-stick arena roguelite. Seal the rift, burn everything that crawls out, and mutate your gun into something unreasonable." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://riftburn.higgsfield.app/assets/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#04050b" />
    <link rel="icon" href="/assets/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #04050b;
        --panel: rgba(9, 13, 30, 0.9);
        --line: rgba(120, 190, 255, 0.22);
        --fg: #eaf6ff;
        --dim: #8fa3c4;
        --cyan: #5fe6ff;
        --hot: #ff9a3c;
        --red: #ff5a4a;
        --gold: #ffd45e;
        --violet: #b48cff;
        --green: #7dffb5;
        --display: "Orbitron", "Arial Black", "Segoe UI", system-ui, sans-serif;
        --body: "Rajdhani", "Segoe UI", system-ui, -apple-system, sans-serif;
        --hud: 1;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font: 600 17px/1.35 var(--body);
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        overscroll-behavior: none;
      }
      body.big { --hud: 1.25; }
      canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: none; }
      body.menu canvas#c { cursor: default; }
      [hidden] { display: none !important; }
      button { font: inherit; color: inherit; }

      /* ── HUD ─────────────────────────────────────────── */
      #hud { position: fixed; inset: 0; pointer-events: none; padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); font-size: calc(16px * var(--hud)); text-shadow: 0 2px 6px rgba(0, 0, 10, 0.9); }
      .tl, .tc, .tr, .bl { position: absolute; }
      .tl { left: inherit; top: inherit; width: min(300px, 40vw); margin: 12px 14px; left: 0; top: 0; }
      .tc { left: 50%; top: 0; transform: translateX(-50%); margin-top: 10px; text-align: center; width: min(520px, 46vw); }
      .tr { right: 0; top: 0; margin: 10px 16px; text-align: right; }
      .bl { left: 0; bottom: 0; margin: 14px; display: flex; gap: 10px; }
      .bar { position: relative; height: calc(16px * var(--hud)); background: rgba(4, 8, 22, 0.75); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; transform: skewX(-12deg); }
      .bar > i { position: absolute; inset: 0; transform-origin: left; display: block; }
      .bar > b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 calc(12px * var(--hud)) / 1 var(--body); transform: skewX(12deg); letter-spacing: 0.04em; }
      #hp > i { background: linear-gradient(90deg, #25d6a2, #7dffb5); transition: transform 0.12s; }
      #hp.low > i { background: linear-gradient(90deg, #ff3b3b, #ff8a5a); }
      #hp .ghost { background: #fff; opacity: 0.55; transition: transform 0.5s 0.15s; }
      #xp { height: calc(8px * var(--hud)); margin-top: 6px; }
      #xp > i { background: linear-gradient(90deg, #f3a52d, var(--gold)); }
      #lv { margin-top: 3px; color: var(--gold); font-weight: 700; letter-spacing: 0.08em; font-size: 0.85em; display: flex; gap: 10px; align-items: center; }
      #lv .shield { color: #9fd0ff; }
      #wave { font: 900 calc(20px * var(--hud)) / 1 var(--display); letter-spacing: 0.14em; }
      #left { color: var(--dim); font-size: 0.85em; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }
      #boss { margin-top: 10px; }
      #boss .name { font: 900 calc(14px * var(--hud)) / 1 var(--display); letter-spacing: 0.22em; color: var(--hot); margin-bottom: 6px; }
      #boss .bar { height: calc(14px * var(--hud)); }
      #boss .bar > i { background: linear-gradient(90deg, #ff3b3b, var(--hot)); transition: transform 0.1s; }
      #score { font: 900 calc(26px * var(--hud)) / 1 var(--display); letter-spacing: 0.06em; }
      #combo { margin-top: 6px; font: 700 calc(18px * var(--hud)) / 1 var(--display); color: var(--hot); opacity: 0; transition: opacity 0.2s; }
      #combo.on { opacity: 1; }
      #combo small { display: block; font: 600 0.62em/1.4 var(--body); color: var(--dim); letter-spacing: 0.12em; }
      #combo .t { display: block; height: 3px; margin-top: 3px; background: var(--hot); transform-origin: right; }
      .chip { position: relative; min-width: calc(112px * var(--hud)); padding: 7px 8px 6px; background: rgba(4, 8, 22, 0.72); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; text-align: center; }
      .chip > i { position: absolute; inset: 0; background: rgba(95, 230, 255, 0.2); transform-origin: left; }
      .chip span { position: relative; display: block; font: 700 0.72em/1.1 var(--display); letter-spacing: 0.1em; }
      .chip kbd { position: relative; display: block; margin-top: 3px; font: 600 0.72em/1 var(--body); color: var(--dim); letter-spacing: 0.06em; }
      .chip.ready { border-color: var(--cyan); box-shadow: 0 0 14px rgba(95, 230, 255, 0.35); }
      #c-od > i { background: rgba(255, 180, 70, 0.25); }
      #c-od.ready { border-color: var(--gold); box-shadow: 0 0 18px rgba(255, 200, 90, 0.6); animation: pulse 0.7s infinite alternate; }
      #c-od.ready span { color: var(--gold); }
      @keyframes pulse { to { box-shadow: 0 0 30px rgba(255, 200, 90, 0.95); } }

      #banner { position: fixed; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none; opacity: 0; }
      #banner.show { animation: banner 2.4s both; }
      #banner h2 { margin: 0; font: 900 clamp(34px, 7vw, 76px) / 1 var(--display); letter-spacing: 0.16em; text-shadow: 0 0 30px rgba(95, 230, 255, 0.7), 0 4px 0 rgba(0, 0, 0, 0.5); }
      #banner p { margin: 10px 0 0; font: 700 clamp(14px, 2.2vw, 22px) / 1 var(--display); letter-spacing: 0.3em; color: var(--cyan); }
      #banner.warn h2 { color: var(--red); text-shadow: 0 0 34px rgba(255, 70, 50, 0.9), 0 4px 0 rgba(0, 0, 0, 0.5); }
      #banner.warn p { color: var(--hot); }
      #banner.gold h2 { color: var(--gold); text-shadow: 0 0 34px rgba(255, 200, 90, 0.9); }
      @keyframes banner {
        0% { opacity: 0; transform: scale(1.35); letter-spacing: 0.5em; }
        12% { opacity: 1; transform: scale(1); }
        78% { opacity: 1; }
        100% { opacity: 0; transform: scale(0.96); }
      }
      #toast { position: fixed; left: 50%; bottom: 17%; transform: translateX(-50%); padding: 8px 18px; background: rgba(4, 8, 22, 0.82); border: 1px solid var(--line); border-radius: 999px; font-weight: 700; letter-spacing: 0.08em; pointer-events: none; opacity: 0; transition: opacity 0.25s; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
      #toast.show { opacity: 1; }
      #dev { position: fixed; left: 8px; bottom: 80px; font: 12px/1.4 ui-monospace, monospace; color: #9f9; pointer-events: none; white-space: pre; }

      /* ── touch ───────────────────────────────────────── */
      #touch { position: fixed; inset: 0; pointer-events: none; }
      .stick { position: absolute; width: 132px; height: 132px; margin: -66px 0 0 -66px; border: 2px solid rgba(140, 220, 255, 0.4); border-radius: 50%; background: rgba(95, 230, 255, 0.06); }
      .stick i { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(140, 225, 255, 0.5); }
      .tbtn { position: absolute; pointer-events: auto; width: 76px; height: 76px; border-radius: 50%; border: 2px solid var(--line); background: rgba(4, 8, 22, 0.6); font: 700 11px/1.1 var(--display); letter-spacing: 0.06em; overflow: hidden; touch-action: none; }
      .tbtn > i { position: absolute; inset: 0; background: rgba(95, 230, 255, 0.22); transform-origin: bottom; }
      .tbtn span { position: relative; }
      #t-dash { right: max(18px, env(safe-area-inset-right)); bottom: 190px; }
      #t-od { right: max(104px, calc(env(safe-area-inset-right) + 86px)); bottom: 236px; }
      #t-od > i { background: rgba(255, 180, 70, 0.3); }
      #t-od.ready { border-color: var(--gold); box-shadow: 0 0 22px rgba(255, 200, 90, 0.8); color: var(--gold); }
      #t-pause { right: max(14px, env(safe-area-inset-right)); top: 92px; width: 46px; height: 46px; font-size: 16px; }

      /* ── screens ─────────────────────────────────────── */
      .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 18px; overflow-y: auto; touch-action: pan-y; background: radial-gradient(ellipse at center, rgba(4, 6, 16, 0.55), rgba(2, 3, 10, 0.9)); animation: fade 0.22s both; }
      @keyframes fade { from { opacity: 0; } }
      .panel { width: min(760px, 100%); max-height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; box-shadow: 0 20px 80px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.03); overflow-y: auto; }
      .panel.wide { width: min(1000px, 100%); }
      h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: 0.12em; }
      .panel > h2 { font-size: clamp(20px, 3.4vw, 30px); margin-bottom: 4px; }
      .sub { color: var(--dim); margin: 0 0 16px; letter-spacing: 0.06em; }
      .btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 22px; border: 1px solid var(--line); border-radius: 8px; background: linear-gradient(180deg, rgba(40, 70, 130, 0.5), rgba(14, 24, 54, 0.7)); font: 700 15px/1 var(--display); letter-spacing: 0.14em; cursor: pointer; transition: transform 0.08s, border-color 0.12s, box-shadow 0.12s; }
      .btn:hover, .btn:focus-visible { border-color: var(--cyan); box-shadow: 0 0 18px rgba(95, 230, 255, 0.35); outline: none; transform: translateY(-1px); }
      .btn:active { transform: translateY(1px); }
      .btn.primary { background: linear-gradient(180deg, #ffb347, #ff6a2b); border-color: #ffd08a; color: #1b0b02; text-shadow: none; }
      .btn.primary:hover, .btn.primary:focus-visible { box-shadow: 0 0 26px rgba(255, 150, 60, 0.75); }
      .btn:disabled { opacity: 0.4; cursor: default; box-shadow: none; transform: none; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .row.end { justify-content: flex-end; margin-top: 18px; }
      .row.center { justify-content: center; }

      /* title */
      #s-title { background: linear-gradient(90deg, rgba(3, 4, 12, 0.94) 0%, rgba(3, 4, 12, 0.72) 38%, rgba(3, 4, 12, 0.1) 78%), var(--art, none) right center / cover no-repeat, radial-gradient(ellipse at 70% 40%, #1a2a66, #04050b 70%); justify-content: flex-start; padding: 4vh max(5vw, 20px); }
      .title { width: min(640px, 100%); }
      .logo { font: 900 clamp(38px, 8.6vw, 88px) / 0.95 var(--display); letter-spacing: 0.02em; white-space: nowrap; margin: 0; background: linear-gradient(180deg, #ffffff 10%, #9ff1ff 45%, #ff9a3c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 22px rgba(95, 230, 255, 0.45)) drop-shadow(0 6px 0 rgba(0, 0, 0, 0.55)); }
      .tag { margin: 12px 0 26px; font-size: 19px; color: #c6d8f2; letter-spacing: 0.05em; }
      .menu { display: grid; gap: 10px; width: min(330px, 100%); }
      .menu .btn { justify-content: flex-start; padding-left: 26px; }
      .menu .btn.primary { min-height: 60px; font-size: 20px; }
      .pilot { margin-top: 22px; display: grid; gap: 8px; width: min(420px, 100%); padding: 12px 14px; background: rgba(4, 8, 22, 0.72); border: 1px solid var(--line); border-radius: 10px; }
      .pilot label { display: flex; align-items: center; gap: 10px; color: var(--dim); letter-spacing: 0.08em; }
      .pilot input { flex: 1; min-width: 0; background: rgba(0, 0, 0, 0.45); border: 1px solid var(--line); border-radius: 6px; color: var(--fg); font: 700 17px/1 var(--body); padding: 8px 10px; letter-spacing: 0.06em; -webkit-user-select: text; user-select: text; }
      .pilot input:focus { outline: none; border-color: var(--cyan); }
      .stats { display: flex; gap: 18px; flex-wrap: wrap; }
      .stats b { color: var(--gold); font-weight: 700; letter-spacing: 0.04em; }
      .conn { font-size: 14px; color: var(--dim); letter-spacing: 0.05em; }
      .conn::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 8px; }
      .conn.on::before { background: var(--green); box-shadow: 0 0 8px var(--green); }

      /* draft */
      .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 14px; }
      .card { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 20px 14px 16px; min-height: 250px; border: 2px solid var(--rc); border-radius: 12px; background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 22%, #0a1026), #070b1c 70%); cursor: pointer; transition: transform 0.12s, box-shadow 0.12s; animation: rise 0.35s both; }
      .card:nth-child(2) { animation-delay: 0.06s; }
      .card:nth-child(3) { animation-delay: 0.12s; }
      @keyframes rise { from { opacity: 0; transform: translateY(26px) scale(0.96); } }
      .card:hover, .card:focus-visible { transform: translateY(-6px); box-shadow: 0 0 34px color-mix(in srgb, var(--rc) 65%, transparent); outline: none; }
      .card .ico { font-size: 46px; line-height: 1; color: var(--rc); filter: drop-shadow(0 0 12px var(--rc)); height: 54px; }
      .card .rar { font: 700 11px/1 var(--display); letter-spacing: 0.24em; color: var(--rc); }
      .card h3 { font-size: 17px; letter-spacing: 0.06em; }
      .card p { margin: 0; color: #c6d8f2; font-size: 16px; }
      .card .pips { margin-top: auto; display: flex; gap: 4px; }
      .card .pips i { width: 9px; height: 9px; border-radius: 2px; border: 1px solid var(--rc); }
      .card .pips i.on { background: var(--rc); }
      .card .pips i.next { background: #fff; border-color: #fff; box-shadow: 0 0 8px #fff; }
      .card .key { position: absolute; top: 8px; left: 10px; font: 700 12px/1 var(--display); color: var(--dim); }
      .card .new { position: absolute; top: 8px; right: 10px; font: 700 10px/1 var(--display); letter-spacing: 0.14em; color: #04050b; background: var(--green); border-radius: 3px; padding: 3px 5px; }

      /* lists */
      .list { display: grid; gap: 8px; margin-top: 6px; }
      .item { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: rgba(6, 10, 26, 0.7); }
      .item h3 { font-size: 15px; letter-spacing: 0.06em; }
      .item p { margin: 0; color: var(--dim); font-size: 15px; }
      .item .pips { display: flex; gap: 3px; margin-top: 5px; }
      .item .pips i { width: 14px; height: 6px; border-radius: 2px; background: rgba(120, 190, 255, 0.18); }
      .item .pips i.on { background: var(--cyan); box-shadow: 0 0 6px rgba(95, 230, 255, 0.7); }
      .item .btn { min-width: 118px; padding: 8px 12px; font-size: 13px; }
      .bank { font: 700 24px/1 var(--body); color: var(--gold); letter-spacing: 0.04em; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); }
      th { color: var(--dim); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
      td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
      tr.me td { color: var(--cyan); }
      .live { color: var(--green); font-size: 14px; }
      .link { display: flex; gap: 8px; margin: 10px 0 4px; }
      .link code { flex: 1; min-width: 0; padding: 10px 12px; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--line); border-radius: 6px; font: 14px/1.3 ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; -webkit-user-select: all; user-select: all; }
      .set { display: grid; grid-template-columns: 1fr auto; gap: 12px 16px; align-items: center; }
      .set input[type="range"] { width: min(220px, 40vw); accent-color: var(--cyan); }
      .tog { min-width: 84px; }
      .tog.on { border-color: var(--cyan); color: var(--cyan); }
      .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 16px 0; }
      .results div { padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: rgba(6, 10, 26, 0.7); text-align: center; }
      .results b { display: block; font: 900 22px/1.1 var(--display); letter-spacing: 0.04em; }
      .results span { color: var(--dim); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
      .payout { display: flex; align-items: baseline; justify-content: center; gap: 12px; font-size: 18px; }
      .payout b { font: 700 32px/1 var(--body); color: var(--gold); }
      .badge { display: inline-block; margin: 0 auto 6px; padding: 5px 12px; border-radius: 999px; background: var(--gold); color: #1b1202; font: 700 12px/1 var(--display); letter-spacing: 0.16em; }
      .mut { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
      .mut span { padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; color: #c6d8f2; }
      .tips { margin: 14px 0 0; padding-left: 18px; color: #c6d8f2; }
      .tips li { margin: 4px 0; }
      .center { text-align: center; }

      #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; justify-items: center; background: var(--bg); z-index: 10; }
      #loading h1 { font-size: clamp(30px, 6vw, 56px); color: var(--cyan); text-shadow: 0 0 24px rgba(95, 230, 255, 0.6); }
      #loading .bar { width: min(320px, 70vw); height: 8px; }
      #loading .bar > i { background: var(--cyan); transform: scaleX(0); transition: transform 0.2s; }

      @media (max-width: 720px) {
        .cards { grid-template-columns: 1fr; }
        .card { min-height: 0; flex-direction: row; text-align: left; align-items: center; padding: 14px; flex-wrap: wrap; }
        .card .ico { font-size: 34px; height: auto; width: 44px; text-align: center; }
        .card .body { flex: 1; min-width: 0; }
        .card .pips { margin: 0; width: 100%; padding-left: 52px; }
        .panel { padding: 16px; }
        #s-title { background: linear-gradient(180deg, rgba(3, 4, 12, 0.6), rgba(3, 4, 12, 0.92) 55%), var(--art, none) center top / cover no-repeat, #04050b; align-items: flex-end; }
        .bl { display: none; }
        #score { font-size: calc(20px * var(--hud)); }
      }
      @media (max-height: 560px) {
        #s-title { align-items: flex-start; padding-top: 14px; padding-bottom: 14px; }
        .logo { font-size: clamp(34px, 12vh, 70px); }
        .tag { margin: 6px 0 12px; font-size: 16px; }
        .menu { grid-template-columns: 1fr 1fr; width: min(520px, 100%); }
        .menu .btn.primary { grid-column: 1 / -1; min-height: 50px; }
        .pilot { margin-top: 12px; }
        .card { min-height: 0; padding: 12px; }
        .card .ico { font-size: 30px; height: 34px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .card, .screen, #banner.show { animation-duration: 0.01s; }
      }
    </style>
  </head>
  <body class="menu">
    <canvas id="c"></canvas>

    <div id="hud" hidden>
      <div class="tl">
        <div class="bar" id="hp"><i class="ghost"></i><i class="fill"></i><b></b></div>
        <div class="bar" id="xp"><i></i></div>
        <div id="lv"></div>
      </div>
      <div class="tc">
        <div id="wave"></div>
        <div id="left"></div>
        <div id="boss" hidden><div class="name"></div><div class="bar"><i></i></div></div>
      </div>
      <div class="tr">
        <div id="score">0</div>
        <div id="combo"><span class="x"></span><small></small><i class="t"></i></div>
      </div>
      <div class="bl">
        <div class="chip" id="c-dash"><i></i><span>DASH</span><kbd></kbd></div>
        <div class="chip" id="c-od"><i></i><span>OVERDRIVE</span><kbd></kbd></div>
      </div>
    </div>

    <div id="touch" hidden>
      <div class="stick" id="stickL" hidden><i></i></div>
      <div class="stick" id="stickR" hidden><i></i></div>
      <button class="tbtn" id="t-od" type="button" aria-label="Overdrive"><i></i><span>OVER<br />DRIVE</span></button>
      <button class="tbtn" id="t-dash" type="button" aria-label="Dash"><i></i><span>DASH</span></button>
      <button class="tbtn" id="t-pause" type="button" aria-label="Pause"><span>II</span></button>
    </div>

    <div id="banner"><h2></h2><p></p></div>
    <div id="toast"></div>
    <div id="dev" hidden></div>
    <div id="screens"></div>

    <div id="loading">
      <h1>RIFTBURN</h1>
      <div class="bar"><i></i></div>
    </div>

    <script type="module" src="/client.js"></script>
  </body>
</html>
